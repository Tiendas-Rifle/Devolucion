<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RFL - Control de Devolucion / Traslado</title>
<style>
:root{
  --navy:#0D1B3E; --navy2:#072758; --arena:#C9C3BA; --arena-clara:#F0ECE6;
  --arena-media:#EAE6DF; --blanco:#FFFFFF; --gris:#8A8680; --verde:#196B24;
  --magenta:#BF0DB2; --cian:#00B0F0;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;background:var(--arena-clara);color:var(--navy);-webkit-font-smoothing:antialiased;}

.top{background:var(--navy);color:#fff;padding:18px 24px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;}
.brand{font-weight:900;font-size:26px;letter-spacing:.02em;}
.brand .reg{font-size:12px;vertical-align:super;font-weight:700;}
.top-title h1{font-size:18px;font-weight:900;text-transform:uppercase;letter-spacing:.03em;}
.top-title .campana{font-size:12px;color:#c9c3ba;margin-top:2px;}
.top-meta{margin-left:auto;text-align:right;font-size:12px;color:#c9c3ba;}
.top-meta b{color:#fff;}
.top-meta .src{font-size:10px;opacity:.7;margin-top:2px;}

.demo-banner{background:var(--magenta);color:#fff;text-align:center;font-size:12px;font-weight:bold;letter-spacing:.03em;padding:8px 16px;}

.global-band{background:var(--navy2);display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));}
.gb{background:var(--navy2);padding:12px 16px;text-align:center;color:#fff;border-right:1px solid rgba(255,255,255,.08);}
.gb:last-child{border-right:none;}
.gb-val{font-weight:900;font-size:22px;}
.gb-lbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#9aa4bd;margin-top:2px;}

.tabs{display:flex;background:var(--arena-media);padding:0 16px;border-bottom:1px solid #d8d2c8;position:sticky;top:0;z-index:5;overflow-x:auto;}
.tab{background:none;border:none;padding:14px 20px;font-family:inherit;font-size:14px;font-weight:bold;color:var(--gris);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;}
.tab.active{color:var(--navy);border-bottom-color:var(--navy);}

.container{max-width:1180px;margin:0 auto;padding:24px 20px 60px;}
.view.hidden{display:none;}

.selector-row{margin-bottom:22px;}
.selector-row label{display:block;font-size:12px;font-weight:bold;letter-spacing:.05em;text-transform:uppercase;color:var(--gris);margin-bottom:6px;}
.selector-row select{width:100%;max-width:460px;padding:12px 14px;font-family:inherit;font-size:15px;border:1px solid #cfc8bd;border-radius:8px;background:#fff;color:var(--navy);font-weight:bold;}

.detail-head{margin-bottom:16px;}
.detail-head h2{font-size:22px;font-weight:900;text-transform:uppercase;letter-spacing:.02em;}
.detail-meta{font-size:13px;color:var(--gris);margin-top:2px;}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px;}
.kpi{background:var(--arena-media);border-radius:8px;padding:16px;}
.kpi-val{font-weight:900;font-size:26px;color:var(--navy);line-height:1;}
.kpi-lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gris);margin-top:8px;}
.kpi.total{background:var(--navy);}
.kpi.total .kpi-val{color:#fff;}
.kpi.total .kpi-lbl{color:#c9c3ba;}

.bar{height:10px;background:var(--arena);border-radius:6px;overflow:hidden;}
.bar>span{display:block;height:100%;background:var(--navy);border-radius:6px;transition:width .5s ease;}
.bar.done>span{background:var(--verde);}

.store-controls{position:sticky;top:var(--tabs-h,48px);z-index:4;background:var(--arena-clara);display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 0;margin-bottom:6px;border-bottom:1px solid #d8d2c8;box-shadow:0 6px 10px -8px rgba(13,27,62,.25);}
.ctrl{display:flex;align-items:center;gap:6px;}
.ctrl-lbl{font-size:10px;font-weight:bold;letter-spacing:.06em;text-transform:uppercase;color:var(--gris);}
.store-controls select{padding:9px 12px;border:1px solid #cfc8bd;border-radius:8px;font-family:inherit;font-size:14px;font-weight:bold;color:var(--navy);background:#fff;max-width:230px;}
.store-controls input[type=search]{flex:1;min-width:160px;padding:9px 12px;border:1px solid #cfc8bd;border-radius:8px;font-family:inherit;font-size:14px;background:#fff;color:var(--navy);}
.filters{display:flex;gap:6px;flex-wrap:wrap;}
.fbtn{background:#fff;border:1px solid #cfc8bd;padding:8px 14px;border-radius:20px;font-family:inherit;font-size:13px;font-weight:bold;color:var(--gris);cursor:pointer;}
.fbtn.active{background:var(--navy);color:#fff;border-color:var(--navy);}

.cat-filter{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.cat-filter select{padding:9px 12px;border:1px solid #cfc8bd;border-radius:8px;font-family:inherit;font-size:14px;font-weight:bold;color:var(--navy);background:#fff;max-width:220px;}
.cat-note{font-size:12px;font-weight:bold;letter-spacing:.03em;color:var(--gris);margin-left:auto;}

.origin{background:var(--arena-clara);border:1px solid #e3ddd2;border-radius:10px;padding:16px;margin-top:16px;}
.origin-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px;position:sticky;top:calc(var(--tabs-h,48px) + var(--ctrls-h,0px));z-index:2;background:var(--arena-clara);padding:8px 0;}
.origin-name{font-weight:900;font-size:15px;text-transform:uppercase;letter-spacing:.02em;color:var(--navy);}
.origin-sub{font-size:12px;color:var(--gris);margin-top:2px;}
.origin-pct{font-weight:900;font-size:20px;color:var(--navy);white-space:nowrap;}
.origin-pct.done{color:var(--verde);}
.ref-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:14px;}

.ref{background:#fff;border:1px solid #e6e0d6;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;}
.ref-img{aspect-ratio:1/1;background:var(--arena-media);position:relative;display:flex;align-items:center;justify-content:center;}
.ref-img img{width:100%;height:100%;object-fit:cover;display:block;}
.ref-ph{text-align:center;padding:10px;}
.ref-ph .code{font-weight:900;font-size:15px;color:var(--navy);}
.ref-ph .lbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gris);margin-top:4px;}
.ref-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;}
.ref-code{font-size:11px;font-weight:bold;letter-spacing:.05em;color:var(--gris);}
.ref-name{font-size:12px;font-weight:bold;color:var(--navy);line-height:1.2;}
.ref-nums{display:flex;justify-content:space-between;align-items:center;margin-top:2px;}
.ref-nums b{color:var(--navy);font-size:15px;}
.ref-pend{font-size:11px;color:var(--gris);}
.pill{font-size:9px;padding:3px 7px;border-radius:20px;font-weight:bold;letter-spacing:.04em;text-transform:uppercase;}
.pill.done{background:#e5f0e6;color:var(--verde);}
.pill.proc{background:#e9edf5;color:var(--navy);}
.pill.none{background:#efece6;color:var(--gris);}

.zone-legend{display:flex;gap:20px;flex-wrap:wrap;margin:12px 0 4px;font-size:13px;color:var(--gris);}
.zone-legend b{color:var(--navy);}
.section-title{font-size:14px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;color:var(--navy);margin:22px 0 12px;position:sticky;top:var(--tabs-h,48px);z-index:3;background:var(--arena-clara);padding:8px 0;}
.store-list{display:flex;flex-direction:column;gap:10px;}
.store-row{width:100%;text-align:left;background:#fff;border:1px solid #e6e0d6;border-radius:10px;padding:14px 16px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;gap:8px;}
.store-row:hover{border-color:var(--navy);}
.sr-top{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.sr-name{font-weight:bold;font-size:14px;color:var(--navy);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.sr-pct{font-weight:900;font-size:18px;color:var(--navy);}
.sr-pct.done{color:var(--verde);}
.sr-sub{font-size:12px;color:var(--gris);}
.prio{font-size:9px;font-weight:bold;letter-spacing:.05em;text-transform:uppercase;background:var(--magenta);color:#fff;padding:3px 7px;border-radius:20px;}

.xt{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid #e6e0d6;font-size:13px;margin-bottom:18px;}
.xt th,.xt td{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.xt thead{position:sticky;top:var(--tabs-h,48px);z-index:3;}
.xt th{background:var(--navy);color:#fff;text-align:left;padding:10px 12px;font-size:11px;letter-spacing:.03em;text-transform:uppercase;font-weight:bold;}
.xt th.num{text-align:right;}
.xt td{padding:9px 12px;border-top:1px solid #efe9df;}
.xt td.num{text-align:right;font-variant-numeric:tabular-nums;}
.xt tbody tr:nth-child(even){background:var(--arena-clara);}
.xt .muted{color:var(--gris);font-size:12px;}
.pctcell{font-weight:900;color:var(--navy);}
.pctcell.done{color:var(--verde);}
.pctcell.low{color:var(--magenta);}
.barcol{width:130px;}
.xt-title-row th{background:var(--navy2);padding:11px 12px;}
.xt-title-inner{display:flex;justify-content:space-between;align-items:center;gap:12px;white-space:normal;text-transform:none;letter-spacing:.02em;font-size:12px;}
.mini-select{padding:7px 10px;border:1px solid #cfc8bd;border-radius:8px;font-family:inherit;font-size:12px;font-weight:bold;color:var(--navy);background:#fff;text-transform:none;letter-spacing:0;flex:none;}

.empty{padding:30px;text-align:center;color:var(--gris);font-size:14px;background:var(--arena-clara);border-radius:10px;border:1px dashed #cfc8bd;}
.foot{text-align:center;padding:24px;font-size:9px;letter-spacing:.25em;text-transform:uppercase;color:var(--gris);}

@media (max-width:640px){
  .top{padding:14px 16px;gap:12px;}
  .top-meta{margin-left:0;text-align:left;width:100%;display:flex;gap:16px;flex-wrap:wrap;}
  .kpi-val{font-size:22px;}
  .detail-head h2{font-size:19px;}
  .xt{font-size:11.5px;}
  .xt th,.xt td{padding:8px 6px;}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;}}
:focus-visible{outline:2px solid var(--cian);outline-offset:2px;}
</style>
</head>
<body>

<header class="top">
  <div class="brand">RFL<span class="reg">&reg;</span></div>
  <div class="top-title">
    <h1>Devolucion / Traslado</h1>
    <div class="campana" id="periodo"></div>
  </div>
  <div class="top-meta">
    <div>Corte: <b id="updated"></b></div>
    <div class="src" id="fuente"></div>
  </div>
</header>

<div class="demo-banner" id="demoBanner" style="display:none">MODO DEMO</div>

<div class="global-band">
  <div class="gb"><div class="gb-val" id="gPct">-</div><div class="gb-lbl">Cumplimiento global</div></div>
  <div class="gb"><div class="gb-val" id="gReal">-</div><div class="gb-lbl">Realizadas</div></div>
  <div class="gb"><div class="gb-val" id="gPed">-</div><div class="gb-lbl">Pedidas</div></div>
  <div class="gb"><div class="gb-val" id="gPend">-</div><div class="gb-lbl">Pendientes</div></div>
</div>

<nav class="tabs">
  <button class="tab active" data-view="exec">Resumen Ejecutivo</button>
  <button class="tab" data-view="tienda">Vista Tienda</button>
  <button class="tab" data-view="zona">Vista Jefe de Zona</button>
</nav>

<div class="cat-filter">
  <div class="ctrl"><span class="ctrl-lbl">Genero</span><select id="genSelect" aria-label="Genero"></select></div>
  <div class="ctrl"><span class="ctrl-lbl">Categoria</span><select id="catSelect" aria-label="Categoria"></select></div>
  <button class="fbtn" id="catReset" type="button">Limpiar</button>
  <span class="cat-note" id="catNote"></span>
</div>

<main class="container">
  <section id="view-exec" class="view">
    <div id="execContent"></div>
  </section>

  <section id="view-tienda" class="view hidden">
    <div id="storeHead"></div>
    <div class="store-controls" id="storeControls">
      <div class="ctrl"><span class="ctrl-lbl">Origen</span><select id="storeSelect" aria-label="Tienda origen"></select></div>
      <div class="ctrl"><span class="ctrl-lbl">Destino</span><select id="destSelect" aria-label="Tienda destino"></select></div>
      <input type="search" id="storeSearch" placeholder="Buscar referencia o color..." aria-label="Buscar referencia o color">
      <div class="filters" id="storeFilters">
        <button class="fbtn active" data-f="todas">Todas</button>
        <button class="fbtn" data-f="pend">Pendientes</button>
        <button class="fbtn" data-f="comp">Completas</button>
      </div>
    </div>
    <div id="destWrap"></div>
  </section>

  <section id="view-zona" class="view hidden">
    <div class="selector-row">
      <label for="jefeSelect">Selecciona el jefe de zona</label>
      <select id="jefeSelect"></select>
    </div>
    <div id="jefeContent"></div>
  </section>
</main>

<footer class="foot">POR RIFLE - PARA COLOMBIA</footer>

  var t=totalsRows(rows);
  return '<section class="origin"><div class="origin-head"><div>'+
    '<div class="origin-name">'+esc(destino)+'</div>'+
    '<div class="origin-sub">'+rows.length+' referencia(s) - Faltan '+fmtInt(t.pend)+' und</div></div>'+
    '<div class="origin-pct'+(t.pct>=1?' done':'')+'">'+fmtPct(t.pct)+'</div></div>'+
    bar(t.pct)+'<div class="ref-grid">'+rows.map(refCard).join('')+'</div></section>';
}

// ---- Vista Tienda ----
var curOrigen=null, curDestino='__all__', curFilter='todas', curSearch='';
var storeHead=document.getElementById('storeHead');
var destSelect=document.getElementById('destSelect');
var storeSearchEl=document.getElementById('storeSearch');

function renderStore(origen){
  curOrigen=origen; curDestino='__all__'; curFilter='todas'; curSearch='';
  if(storeSearchEl) storeSearchEl.value='';
  var fb=document.getElementById('storeFilters');
  if(fb) fb.querySelectorAll('.fbtn').forEach(function(x){x.classList.toggle('active',x.dataset.f==='todas');});
  var bo=byOrigen[origen];
  if(!bo){ storeHead.innerHTML='<div class="empty">'+(catActive()?'Esta tienda no tiene movimientos para el filtro de catalogo actual.':'Tienda sin movimientos.')+'</div>'; if(destSelect)destSelect.innerHTML=''; document.getElementById('destWrap').innerHTML=''; return; }
  var rows=movByOrigen[origen]||[]; var t=totalsRows(rows);
  storeHead.innerHTML=
    '<div class="detail-head"><div><h2>'+esc(origen)+'</h2>'+
      '<div class="detail-meta">Jefe de zona: '+esc(bo.jefe)+' - Despacha hacia las tiendas destino</div></div></div>'+
    kpis(t)+bar(t.pct);
  // destinos de esta tienda, ordenados por mayor pendiente
  var dt={};
  rows.forEach(function(m){var d=dt[m.destino]=dt[m.destino]||{ped:0,real:0}; d.ped+=m.ped; d.real+=m.real;});
  var dests=Object.keys(dt).sort(function(a,b){return (dt[b].ped-dt[b].real)-(dt[a].ped-dt[a].real);});
  var opts='<option value="__all__">Todas las tiendas destino ('+dests.length+')</option>';
  dests.forEach(function(d){opts+='<option value="'+esc(d)+'">'+esc(d)+'</option>';});
  if(destSelect) destSelect.innerHTML=opts;
  renderDest();
}
function renderDest(){
  var rows=movByOrigen[curOrigen]||[];
  var filtered=rows.filter(function(m){
    if(curDestino!=='__all__' && m.destino!==curDestino) return false;
    var p=ratio(m.real,m.ped);
    if(curFilter==='pend'&&p>=1)return false;
    if(curFilter==='comp'&&p<1)return false;
    if(curSearch){var hay=(refName(m.ref)+' '+m.destino).toLowerCase();if(hay.indexOf(curSearch)===-1)return false;}
    return true;
  });
  var groups={}; filtered.forEach(function(m){(groups[m.destino]=groups[m.destino]||[]).push(m);});
  var order=Object.keys(groups).sort(function(a,b){return totalsRows(groups[b]).pend-totalsRows(groups[a]).pend;});
  var wrap=document.getElementById('destWrap');
  wrap.innerHTML = order.length? order.map(function(d){return destSection(d,groups[d]);}).join('')
                               : '<div class="empty">No hay referencias que coincidan con el filtro.</div>';
}

// ---- Vista Jefe de Zona ----
var curJefe=null;
function renderJefe(jefe){
  curJefe=jefe;
  var bj=byJefe[jefe]; if(!bj){jefeContent.innerHTML='<div class="empty">'+(catActive()?'Este jefe no tiene movimientos para el filtro de catalogo actual.':'Sin datos.')+'</div>';return;}
  var stores=Object.keys(bj.stores).map(function(o){
    var b=byOrigen[o];
    return {o:o,st:{ped:b.ped,real:b.real,pend:b.ped-b.real,pct:ratio(b.real,b.ped)}};
  });
  stores.sort(function(a,b){return (a.st.pct-b.st.pct) || (b.st.pend-a.st.pend);});
  var t={ped:bj.ped,real:bj.real,pend:bj.ped-bj.real,pct:ratio(bj.real,bj.ped)};
  var comp=stores.filter(function(x){return x.st.ped>0&&x.st.pct>=1;}).length;
  var proc=stores.filter(function(x){return x.st.pct>0&&x.st.pct<1;}).length;
  var sin =stores.filter(function(x){return x.st.real===0;}).length;
  jefeContent.innerHTML=
    '<div class="detail-head"><div><h2>'+esc(jefe)+'</h2><div class="detail-meta">'+stores.length+' tiendas a cargo</div></div></div>'+
    kpisZone(t,stores.length)+bar(t.pct)+
    '<div class="zone-legend"><span><b>'+comp+'</b> completas</span><span><b>'+proc+'</b> en proceso</span><span><b>'+sin+'</b> sin iniciar</span></div>'+
    '<h3 class="section-title">Tiendas (de menor a mayor cumplimiento)</h3><div class="store-list">'+
    stores.map(function(x){
      var prio=x.st.ped>0&&x.st.pct<0.5;
      return '<button class="store-row" data-store="'+esc(x.o)+'"><div class="sr-top">'+
        '<div class="sr-name">'+esc(x.o)+(prio?' <span class="prio">Prioridad</span>':'')+'</div>'+
        '<div class="sr-pct'+(x.st.pct>=1?' done':'')+'">'+fmtPct(x.st.pct)+'</div></div>'+
        bar(x.st.pct)+
        '<div class="sr-sub">'+fmtInt(x.st.real)+'/'+fmtInt(x.st.ped)+' und - Faltan '+fmtInt(x.st.pend)+'</div></button>';
    }).join('')+'</div>';
}

// ---- Resumen Ejecutivo ----
var execJefeFilter='__all__';
function pctClass(p){return p>=1?'done':(p===0?'low':'');}
function renderExec(){
  if(execJefeFilter!=='__all__' && JEFES.indexOf(execJefeFilter)===-1) execJefeFilter='__all__';
  var g=gTotals();

  var jefeRows=JEFES.map(function(j){var b=byJefe[j];return {j:j,ped:b.ped,real:b.real,pend:b.ped-b.real,pct:ratio(b.real,b.ped),n:Object.keys(b.stores).length};});
  jefeRows.sort(function(a,b){return (a.pct-b.pct) || (b.pend-a.pend);});
  var jefeTable='<table class="xt">'+
    '<colgroup><col style="width:30%"><col style="width:14%"><col style="width:14%"><col style="width:12%"><col style="width:14%"><col style="width:16%"></colgroup>'+
    '<thead>'+
      '<tr class="xt-title-row"><th colspan="6"><div class="xt-title-inner"><span>Cumplimiento por jefe de zona (menor a mayor)</span></div></th></tr>'+
      '<tr><th>Jefe de zona</th><th class="num">Realizado</th><th class="num">Pedido</th><th class="num">Pend.</th><th class="num">Cumpl.</th><th class="barcol">Avance</th></tr>'+
    '</thead><tbody>'+
    jefeRows.map(function(x){return '<tr><td title="'+esc(x.j)+'">'+esc(x.j)+' <span class="muted">('+x.n+')</span></td>'+
      '<td class="num">'+fmtInt(x.real)+'</td><td class="num">'+fmtInt(x.ped)+'</td><td class="num">'+fmtInt(x.pend)+'</td>'+
      '<td class="num pctcell '+pctClass(x.pct)+'">'+fmtPct(x.pct)+'</td><td class="barcol">'+bar(x.pct)+'</td></tr>';}).join('')+
    '</tbody></table>';

  var storeRows=ORIGENES.map(function(o){var b=byOrigen[o];return {o:o,jefe:b.jefe,ped:b.ped,real:b.real,pend:b.ped-b.real,pct:ratio(b.real,b.ped)};});
  if(execJefeFilter!=='__all__') storeRows=storeRows.filter(function(x){return x.jefe===execJefeFilter;});
  storeRows.sort(function(a,b){return (a.pct-b.pct) || (b.pend-a.pend);});
  var jefeOpts='<option value="__all__">Todas las zonas</option>'+JEFES.map(function(j){return '<option value="'+esc(j)+'"'+(j===execJefeFilter?' selected':'')+'>'+esc(j)+'</option>';}).join('');
  var storeTable='<table class="xt">'+
    '<colgroup><col style="width:26%"><col style="width:18%"><col style="width:12%"><col style="width:12%"><col style="width:10%"><col style="width:12%"><col style="width:10%"></colgroup>'+
    '<thead>'+
      '<tr class="xt-title-row"><th colspan="7"><div class="xt-title-inner"><span>Cumplimiento por tienda (menor a mayor)</span>'+
        '<select id="execJefe" class="mini-select">'+jefeOpts+'</select></div></th></tr>'+
      '<tr><th>Tienda</th><th>Jefe</th><th class="num">Realizado</th><th class="num">Pedido</th><th class="num">Pend.</th><th class="num">Cumpl.</th><th class="barcol">Avance</th></tr>'+
    '</thead><tbody>'+
    storeRows.map(function(x){return '<tr><td title="'+esc(x.o)+'">'+esc(x.o)+'</td><td class="muted" title="'+esc(x.jefe)+'">'+esc(x.jefe)+'</td>'+
      '<td class="num">'+fmtInt(x.real)+'</td><td class="num">'+fmtInt(x.ped)+'</td><td class="num">'+fmtInt(x.pend)+'</td>'+
      '<td class="num pctcell '+pctClass(x.pct)+'">'+fmtPct(x.pct)+'</td><td class="barcol">'+bar(x.pct)+'</td></tr>';}).join('')+
    '</tbody></table>';

  execContent.innerHTML=
    '<div class="detail-head"><div><h2>Resumen Ejecutivo</h2><div class="detail-meta">Corte '+esc(fmtDate(DATA.meta.actualizado))+' - Realizado vs. pedido'+(catActive()?' - '+esc([catFilter!=='__all__'?catFilter:'',genFilter!=='__all__'?genFilter:''].filter(Boolean).join(' / ')):'')+'</div></div></div>'+
    kpis(g)+bar(g.pct)+
    '<div class="xt-wrap">'+jefeTable+'</div><div class="xt-wrap">'+storeTable+'</div>';
  var sel=document.getElementById('execJefe');
  if(sel) sel.addEventListener('change',function(e){execJefeFilter=e.target.value;renderExec();});
}

// ---- Navegacion ----
function switchView(v){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('active',t.dataset.view===v);});
  document.getElementById('view-tienda').classList.toggle('hidden',v!=='tienda');
  document.getElementById('view-zona').classList.toggle('hidden',v!=='zona');
  document.getElementById('view-exec').classList.toggle('hidden',v!=='exec');
  setStickyOffsets();
}
document.querySelectorAll('.tab').forEach(function(t){t.addEventListener('click',function(){switchView(t.dataset.view);});});
jefeContent.addEventListener('click',function(e){var row=e.target.closest('.store-row');if(row)goToStore(row.dataset.store);});
function goToStore(o){switchView('tienda');document.getElementById('storeSelect').value=o;renderStore(o);window.scrollTo({top:0,behavior:'smooth'});}

// ---- Init ----
function setStickyOffsets(){
  var nav=document.querySelector('.tabs');
  document.documentElement.style.setProperty('--tabs-h',(nav?nav.offsetHeight:48)+'px');
  var sc=document.getElementById('storeControls');
  var ch=(sc&&sc.offsetParent!==null)?sc.offsetHeight:0;
  document.documentElement.style.setProperty('--ctrls-h',ch+'px');
}
function updateGlobalBand(){
  var g=gTotals();
  document.getElementById('gPct').textContent=fmtPct(g.pct);
  document.getElementById('gReal').textContent=fmtInt(g.real);
  document.getElementById('gPed').textContent=fmtInt(g.ped);
  document.getElementById('gPend').textContent=fmtInt(g.pend);
}
function updateCatNote(){
  var el=document.getElementById('catNote'); if(!el)return;
  if(!catActive()){el.textContent='Mostrando todo el catalogo';return;}
  var parts=[]; if(catFilter!=='__all__')parts.push(catFilter); if(genFilter!=='__all__')parts.push(genFilter);
  el.textContent='Filtrando: '+parts.join(' - ');
}
function applyCatFilter(){
  recompute();
  updateGlobalBand();
  updateCatNote();
  renderExec();
  var ss=document.getElementById('storeSelect'); if(ss&&ss.value) renderStore(ss.value);
  var js=document.getElementById('jefeSelect'); if(js&&js.value) renderJefe(js.value);
}
function init(){
  setStickyOffsets(); window.addEventListener('resize',setStickyOffsets);
  document.getElementById('periodo').textContent=DATA.meta.periodo||'';
  document.getElementById('updated').textContent=fmtDate(DATA.meta.actualizado);
  var f=document.getElementById('fuente'); if(f) f.textContent=DATA.meta.fuente?('Fuente: '+DATA.meta.fuente):'';
  if(DATA.meta.esDemo){var b=document.getElementById('demoBanner');if(b)b.style.display='block';}

  var gen=document.getElementById('genSelect');
  if(gen){ gen.innerHTML='<option value="__all__">Todos los generos</option>'+GENS.map(function(x){return '<option value="'+esc(x)+'">'+esc(x)+'</option>';}).join('');
    gen.addEventListener('change',function(e){genFilter=e.target.value;applyCatFilter();}); }
  var cat=document.getElementById('catSelect');
  if(cat){ cat.innerHTML='<option value="__all__">Todas las categorias</option>'+CATS.map(function(x){return '<option value="'+esc(x)+'">'+esc(x)+'</option>';}).join('');
    cat.addEventListener('change',function(e){catFilter=e.target.value;applyCatFilter();}); }
  var cr=document.getElementById('catReset');
  if(cr) cr.addEventListener('click',function(){genFilter='__all__';catFilter='__all__';if(gen)gen.value='__all__';if(cat)cat.value='__all__';applyCatFilter();});

  var ss=document.getElementById('storeSelect');
  ALL_JEFES.forEach(function(j){
    var stores=Object.keys(fullByJefe[j].stores).sort(sortEs);
    var og=document.createElement('optgroup'); og.label=j;
    stores.forEach(function(o){var op=document.createElement('option');op.value=o;op.textContent=o;og.appendChild(op);});
    ss.appendChild(og);
  });
  ss.addEventListener('change',function(e){renderStore(e.target.value);});
  if(destSelect) destSelect.addEventListener('change',function(e){curDestino=e.target.value;renderDest();});
  if(storeSearchEl) storeSearchEl.addEventListener('input',function(e){curSearch=e.target.value.toLowerCase();renderDest();});
  var fbAll=document.getElementById('storeFilters');
  if(fbAll) fbAll.querySelectorAll('.fbtn').forEach(function(b){b.addEventListener('click',function(){
    fbAll.querySelectorAll('.fbtn').forEach(function(x){x.classList.remove('active');});
    b.classList.add('active');curFilter=b.dataset.f;renderDest();});});

  var js=document.getElementById('jefeSelect');
  ALL_JEFES.forEach(function(j){var op=document.createElement('option');op.value=j;op.textContent=j;js.appendChild(op);});
  js.addEventListener('change',function(e){renderJefe(e.target.value);});

  updateGlobalBand();
  updateCatNote();
  if(ss.options.length){ss.selectedIndex=0;renderStore(ss.value);}
  if(js.options.length){js.selectedIndex=0;renderJefe(js.value);}
  renderExec();
}
init();
</script>
</body>
</html>
